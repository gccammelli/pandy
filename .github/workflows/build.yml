# Tests on every push to main. A "v*" tag builds the release APK (signed with the release key from the repository's
# secrets) and an unsigned iOS .ipa, and attaches both to a GitHub Release; Actions → Build → Run workflow builds a
# debug APK for testing.
name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true

      - name: Test
        run: |
          python3 .github/scripts/public_issue_patch.py --self-test
          ./gradlew testDebugUnitTest :shared:koverXmlReportDebug :shared:koverVerifyDebug

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: shared/build/reports/kover/reportDebug.xml
          retention-days: 1

      - name: Build isolated Android UI test app
        run: ./gradlew -Ppandy.testbed assembleDebug

      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Android demo UI and pause/resume round trip
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash tools/android-smoke.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Android UI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-ui-evidence
          path: build/android-smoke/

      # Run by hand: debug-signed, so it installs without the release key.
      - name: Build debug APK
        if: github.event_name == 'workflow_dispatch'
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk pandy.apk

      # Tags: the release APK, signed with the release key (secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS,
      # KEY_PASSWORD). A fixed-name copy too, so releases/latest/download/pandy.apk always links the newest.
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PANDY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PANDY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PANDY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Add the release key secrets (see README, Building)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          PANDY_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "pandy-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk pandy.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: apk
          path: pandy*.apk

  # Unsigned .ipa: sign it with your own Apple ID via SideStore or AltStore. Plus one simulator screenshot of the
  # first screen, to check the app starts.
  ios:
    # Releases and manual runs only: a pushed commit doesn't need a new .ipa.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true

      - name: Shared tests on the iOS simulator
        run: ./gradlew :shared:iosX64Test

      - name: Build unsigned .ipa
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build/ios" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/ios/Release-iphoneos/Pandy.app Payload/
          zip -qry pandy.ipa Payload

      - name: Simulator screenshot of the first screen
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Debug -sdk iphonesimulator -arch x86_64 \
            SYMROOT="$PWD/build/ios-sim" CODE_SIGNING_ALLOWED=NO build
          TYPE=$(xcrun simctl list devicetypes | grep -oE 'com.apple.CoreSimulator.SimDeviceType.iPhone-1[0-9](-Pro)?' | tail -1)
          RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)
          DEV=$(xcrun simctl create pandy "$TYPE" "$RUNTIME")
          xcrun simctl boot "$DEV" && xcrun simctl bootstatus "$DEV"
          xcrun simctl install "$DEV" build/ios-sim/Debug-iphonesimulator/Pandy.app
          mkdir -p screenshots
          xcrun simctl launch "$DEV" io.github.gccammelli.pandy; sleep 25
          xcrun simctl io "$DEV" screenshot screenshots/1-connect.png
          xcrun simctl ui "$DEV" appearance dark; sleep 5
          xcrun simctl io "$DEV" screenshot screenshots/2-connect-dark.png
          xcrun simctl spawn "$DEV" log show --last 2m --predicate 'process == "Pandy"' --style compact | tail -100 > screenshots/app-log.txt || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios
          path: |
            pandy.ipa
            screenshots/

  coverage:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage
      - name: Upload coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: reportDebug.xml
          flags: android-unit
          fail_ci_if_error: true
          use_oidc: true

  release:
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success' && needs.ios.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apk
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ios
          path: ios-artifact
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            release/pandy-${{ github.ref_name }}.apk
            release/pandy.apk
            ios-artifact/pandy.ipa
          generate_release_notes: true

  discord:
    name: Announce release in Discord
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Post release
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_RELEASE_CHANNEL_ID: ${{ secrets.DISCORD_RELEASE_CHANNEL_ID }}
          RELEASE_NAME: ${{ github.event.repository.name }}
          RELEASE_URL: "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
        run: |
          [ -n "$DISCORD_BOT_TOKEN" ] || { echo "::error::Missing DISCORD_BOT_TOKEN repository secret"; exit 1; }
          [ -n "$DISCORD_RELEASE_CHANNEL_ID" ] || { echo "::error::Missing DISCORD_RELEASE_CHANNEL_ID repository secret"; exit 1; }
          payload=$(jq -n --arg content "$RELEASE_NAME $GITHUB_REF_NAME is released: $RELEASE_URL" '{content: $content}')
          curl --fail-with-body --retry 2 --retry-all-errors \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://discord.com/api/v10/channels/$DISCORD_RELEASE_CHANNEL_ID/messages"
